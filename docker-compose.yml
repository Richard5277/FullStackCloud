version: '3.7'

services:

  frontend:
    build:
      context: ./xshop
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./xshop:/app
      - xshop-node-modules:/app/node_modules
    depends_on:
      - api
  api:
    build:
      context: ./xshopapi
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./xshopapi:/app
      - xshopapi-node-modules:/app/node_modules
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGODB_URI=mongodb://mongodb:27017/xshop
    depends_on:
      - redis
      - mongodb
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:5
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mongo-data:
  xshop-node-modules:
  xshopapi-node-modules: